          type: integer
        username:
          type: string
          readOnly: true
        shop:
          type: string
          format: uuid
          readOnly: true
        role:
          $ref: '#/components/schemas/RoleEnum'
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - role
      - shop
      - user
      - username
    EmployeeRequest:
      type: object
      properties:
        user:
          type: integer
        role:
          $ref: '#/components/schemas/RoleEnum'
        is_active:
          type: boolean
      required:
