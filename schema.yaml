components:
  schemas:
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 50
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - slug
      - updated_at
    CategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
      required:
      - name
    Customer:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        first_name:
          type: string
          maxLength: 256
        last_name:
          type: string
          nullable: true
          maxLength: 256
        address:
          type: string
          nullable: true
          maxLength: 256
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
            maxLength: 256
          - type: string
            maxLength: 0
        phone:
          type: string
          nullable: true
          maxLength: 30
        loyalty_points:
          type: integer
          readOnly: true
      required:
      - first_name
      - id
      - loyalty_points
    CustomerRequest:
      type: object
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 256
        last_name:
          type: string
          nullable: true
          maxLength: 256
        address:
          type: string
          nullable: true
          maxLength: 256
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
            maxLength: 256
          - type: string
            maxLength: 0
        phone:
          type: string
          nullable: true
          maxLength: 30
      required:
      - first_name
    Employee:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
