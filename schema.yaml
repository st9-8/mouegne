openapi: 3.0.3
info:
  title: Mouegne API
  version: 1.0.0
  description: API de gestion de vente au comptoir multi-boutiques pour AEME Consulting.
paths:
  /api/shops/:
    get:
      operationId: api_shops_list
      description: |-
        Liste/CRUD des boutiques accessibles à l'utilisateur connecté.
        Pas de nesting ici : c'est la racine, /api/shops/.
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Shop'
          description: ''
    post:
      operationId: api_shops_create
      description: |-
        Liste/CRUD des boutiques accessibles à l'utilisateur connecté.
        Pas de nesting ici : c'est la racine, /api/shops/.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShopRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ShopRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ShopRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shop'
          description: ''
  /api/shops/{id}/:
    get:
      operationId: api_shops_retrieve
      description: |-
        Liste/CRUD des boutiques accessibles à l'utilisateur connecté.
        Pas de nesting ici : c'est la racine, /api/shops/.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) shop.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
